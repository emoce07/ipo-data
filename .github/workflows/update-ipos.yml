name: Update IPO Data

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST daily (3:30 UTC)
  workflow_dispatch: {}      # allows manual "Run workflow" button too

permissions:
  contents: write

jobs:
  update-ipo-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch live IPO data from InvestorGain (via Parse API) and build ipos.json
        env:
          PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'PYEOF'
          import json, os, re, urllib.request, urllib.error, sys
          from datetime import datetime, date, timezone

          def normalize_name(name):
              """Mirrors the app's normalizeIpoName() exactly, so a name match
              here is guaranteed consistent with how the app itself matches
              IPOs during sync — avoids silent drift between the two."""
              s = (name or "").lower()
              s = re.sub(r"\([^)]*\)", " ", s)
              s = re.sub(r"\b(ipo|limited|ltd|pvt|private)\b", " ", s)
              s = re.sub(r"[^a-z0-9]+", " ", s)
              return " ".join(s.split())

          api_key = os.environ["PARSE_API_KEY"]
          url = "https://api.parse.bot/scraper/c1d0143b-268f-4141-8b27-85b4ca0368f8/get_live_gmp"
          req = urllib.request.Request(url, headers={"X-API-Key": api_key})

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = json.loads(resp.read().decode())
          except urllib.error.HTTPError as e:
              print(f"::error::Parse API HTTP error {e.code}: {e.read().decode()}")
              sys.exit(1)
          except Exception as e:
              print(f"::error::Parse API request failed: {e}")
              sys.exit(1)

          items = (raw.get("data") or {}).get("items") or raw.get("items") or []
          if not items:
              print("::warning::No items returned from Parse API — leaving ipos.json unchanged")
              sys.exit(0)

          # Load yesterday's file (if any) so we can carry forward each IPO's
          # gmpHistory instead of overwriting it — this is what lets the app
          # show a date-wise GMP table, not just today's single number.
          existing_by_name = {}
          try:
              with open("ipos.json", "r", encoding="utf-8") as f:
                  prev = json.load(f)
              for prev_ipo in prev.get("ipos", []):
                  existing_by_name[normalize_name(prev_ipo.get("name", ""))] = prev_ipo
          except Exception:
              pass  # first run ever, or file missing/corrupt — start fresh

          # Known registrars the app can actually route "Check allotment" to.
          # Gemini's answer is only ever accepted if it matches one of these
          # (case-insensitively, substring match) — anything else is treated
          # as "couldn't determine" rather than saved as free text, so a
          # vague or wrong-sounding answer can never silently become a
          # broken registrar link in the app.
          KNOWN_REGISTRARS = [
              "KFin Technologies", "Link Intime", "Bigshare Services",
              "Cameo Corporate Services", "Skyline Financial Services",
          ]
          GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY", "")
          _gemini_calls_made = 0
          _GEMINI_DAILY_SAFETY_CAP = 100  # well under the 5,000/month free quota

          def lookup_registrar_via_gemini(ipo_name):
              """Asks Gemini, with Google Search grounding on, which registrar
              handles this specific IPO. Returns a known registrar name on a
              confident, matching answer, or None otherwise — never guesses
              and never saves free-text. Any failure (no key, quota, network,
              unrecognized answer) just leaves the registrar unset, same as
              before this feature existed — the app's own picker modal
              remains the fallback either way."""
              global _gemini_calls_made
              if not GEMINI_API_KEY:
                  return None
              if _gemini_calls_made >= _GEMINI_DAILY_SAFETY_CAP:
                  return None
              prompt = (
                  f"What is the registrar company for the Indian IPO \"{ipo_name}\"? "
                  f"Answer with ONLY the registrar's company name, nothing else — "
                  f"no explanation, no punctuation, just the name. "
                  f"It is almost always one of: KFin Technologies, Link Intime, "
                  f"Bigshare Services, Cameo Corporate Services, Skyline Financial Services."
              )
              body = json.dumps({
                  "contents": [{"parts": [{"text": prompt}]}],
                  "tools": [{"google_search": {}}],
              }).encode()
              url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent"
              req = urllib.request.Request(url, data=body, headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": GEMINI_API_KEY,
              })
              try:
                  _gemini_calls_made += 1
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      result = json.loads(resp.read().decode())
                  text = result["candidates"][0]["content"]["parts"][0]["text"].strip()
              except Exception as e:
                  print(f"::warning::{ipo_name}: Gemini registrar lookup failed: {e}")
                  return None
              text_low = text.lower()
              for known in KNOWN_REGISTRARS:
                  if known.lower() in text_low:
                      return known
              print(f"::warning::{ipo_name}: Gemini answered '{text}' — didn't match a known registrar, leaving unset")
              return None

          def to_int(v, field_name, ipo_name):
              """Parse a number out of whatever the API gives us. Handles plain
              numbers, ranges like '130-137' or '₹130 to ₹137' (takes the higher
              end, since that's what gets blocked), and logs anything it can't
              parse at all so a future run (or a human) can see exactly which
              IPO/field needs attention instead of silently becoming 0."""
              if v is None or str(v).strip() in ("", "TBA", "N/A", "-", "--"):
                  print(f"::warning::{ipo_name}: '{field_name}' is empty/placeholder ('{v}') — left as 0")
                  return 0
              s = str(v).replace(",", "").replace("₹", "").strip()
              try:
                  return int(float(s))
              except Exception:
                  pass
              # range like "130-137" or "130 to 137" -> take the higher number
              nums = re.findall(r"\d+(?:\.\d+)?", s)
              if nums:
                  return int(float(max(nums, key=float)))
              print(f"::warning::{ipo_name}: could not parse '{field_name}' from raw value '{v}' — left as 0")
              return 0

          ipos = []
          incomplete = []
          for it in items:
              name = (it.get("name") or "").strip()
              if not name:
                  continue
              full_name = name if name.lower().endswith("ipo") else f"{name} IPO"
              price = to_int(it.get("price"), "price", full_name)
              lot = to_int(it.get("lot_size"), "lot_size", full_name)
              gmp_pct = it.get("gmp_percent")
              gmp_price = it.get("gmp_price")
              data_complete = price > 0 and lot > 0
              if not data_complete:
                  incomplete.append(full_name)

              # Carry forward this IPO's existing GMP history (matched by
              # normalized name, same matching the app itself uses) and
              # append today's reading — but only once per day, so re-runs
              # on the same day (e.g. a manual trigger) don't duplicate.
              prev_ipo = existing_by_name.get(normalize_name(full_name), {})
              gmp_history = list(prev_ipo.get("gmpHistory") or [])
              today_iso = date.today().isoformat()
              already_logged_today = any(h.get("date") == today_iso for h in gmp_history)
              if not already_logged_today and (gmp_pct is not None or gmp_price is not None):
                  gmp_history.append({
                      "date": today_iso,
                      "gmpPercent": gmp_pct if gmp_pct is not None else None,
                      "gmpPrice": gmp_price if gmp_price is not None else None,
                  })
              # Keep roughly the last 90 days per IPO so this never grows unbounded.
              gmp_history = gmp_history[-90:]

              # Registrar: once known (either picked manually in the app, or
              # found by Gemini on a previous run), it's carried forward and
              # NEVER re-queried or overwritten — this respects a user's own
              # manual pick in the app as final, and keeps Gemini usage down
              # to one lookup per IPO, ever, not once per day.
              registrar = prev_ipo.get("registrar") or ""
              if not registrar and data_complete:
                  # Only bother looking up IPOs whose core data is already
                  # confirmed real (skips wasting a lookup on something that
                  # might not even be a genuine current IPO).
                  found = lookup_registrar_via_gemini(full_name)
                  if found:
                      registrar = found

              ipo_entry = {
                  "name": full_name,
                  "company": name,
                  "openDate": it.get("open_date") or "",
                  "closeDate": it.get("close_date") or "",
                  "allotmentDate": "",
                  "listingDate": "",
                  "priceBand": f"₹{price}" if price else "",
                  "maxPrice": price,
                  "lotSize": lot,
                  "registrar": registrar,
                  "registrarUrl": "",
                  "gmpPercent": gmp_pct if gmp_pct is not None else None,
                  "gmpPrice": gmp_price if gmp_price is not None else None,
                  "gmpHistory": gmp_history,
                  "dataComplete": data_complete,
                  "notes": f"Issue size {it.get('ipo_size_cr') or it.get('ipo_size') or ''}. Auto-synced from InvestorGain via Parse API.".strip(),
              }
              ipos.append(ipo_entry)

          output = {
              "updatedAt": date.today().isoformat(),
              "updatedAtTime": datetime.now(timezone.utc).isoformat(),
              "source": "InvestorGain (via Parse.bot API) — auto-updated",
              "ipos": ipos,
          }

          with open("ipos.json", "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2, ensure_ascii=False)

          print(f"Wrote {len(ipos)} IPOs to ipos.json")
          if incomplete:
              print(f"::warning::{len(incomplete)} IPO(s) missing price/lot size from the API: {', '.join(incomplete)}")
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name "ipo-data-bot"
          git config user.email "actions@github.com"
          git add ipos.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update IPO data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
