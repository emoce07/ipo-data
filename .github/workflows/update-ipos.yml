name: Update IPO Data

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST daily (3:30 UTC)
  workflow_dispatch: {}      # allows manual "Run workflow" button too

permissions:
  contents: write

jobs:
  update-ipo-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch live IPO data from InvestorGain (via Parse API) and build ipos.json
        env:
          PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}
        run: |
          python3 - << 'PYEOF'
          import json, os, urllib.request, urllib.error, sys
          from datetime import datetime, date

          api_key = os.environ["PARSE_API_KEY"]
          url = "https://api.parse.bot/scraper/c1d0143b-268f-4141-8b27-85b4ca0368f8/get_live_gmp"
          req = urllib.request.Request(url, headers={"X-API-Key": api_key})

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = json.loads(resp.read().decode())
          except urllib.error.HTTPError as e:
              print(f"::error::Parse API HTTP error {e.code}: {e.read().decode()}")
              sys.exit(1)
          except Exception as e:
              print(f"::error::Parse API request failed: {e}")
              sys.exit(1)

          items = (raw.get("data") or {}).get("items") or raw.get("items") or []
          if not items:
              print("::warning::No items returned from Parse API — leaving ipos.json unchanged")
              sys.exit(0)

          def to_int(v):
              try:
                  return int(float(str(v).replace(",", "").replace("₹", "").strip()))
              except Exception:
                  return 0

          ipos = []
          for it in items:
              name = (it.get("name") or "").strip()
              if not name:
                  continue
              price = to_int(it.get("price"))
              lot = to_int(it.get("lot_size"))
              gmp_pct = it.get("gmp_percent")
              gmp_price = it.get("gmp_price")
              ipo_entry = {
                  "name": name if name.lower().endswith("ipo") else f"{name} IPO",
                  "company": name,
                  "openDate": it.get("open_date") or "",
                  "closeDate": it.get("close_date") or "",
                  "allotmentDate": "",
                  "listingDate": "",
                  "priceBand": f"₹{price}" if price else "",
                  "maxPrice": price,
                  "lotSize": lot,
                  "registrar": "",
                  "registrarUrl": "",
                  "gmpPercent": gmp_pct if gmp_pct is not None else None,
                  "gmpPrice": gmp_price if gmp_price is not None else None,
                  "notes": f"Issue size {it.get('ipo_size_cr') or it.get('ipo_size') or ''}. Auto-synced from InvestorGain via Parse API.".strip(),
              }
              ipos.append(ipo_entry)

          output = {
              "updatedAt": date.today().isoformat(),
              "updatedAtTime": datetime.utcnow().isoformat() + "Z",
              "source": "InvestorGain (via Parse.bot API) — auto-updated",
              "ipos": ipos,
          }

          with open("ipos.json", "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2, ensure_ascii=False)

          print(f"Wrote {len(ipos)} IPOs to ipos.json")
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name "ipo-data-bot"
          git config user.email "actions@github.com"
          git add ipos.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update IPO data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
