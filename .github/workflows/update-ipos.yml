name: Update IPO Data

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST daily (3:30 UTC)
  workflow_dispatch: {}      # allows manual "Run workflow" button too

permissions:
  contents: write

jobs:
  update-ipo-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch live IPO data from InvestorGain (via Parse API) and build ipos.json
        env:
          PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python3 - << 'PYEOF'
          import json, os, re, time, urllib.request, urllib.error, sys
          from datetime import datetime, date, timezone

          def normalize_name(name):
              """Mirrors the app's normalizeIpoName() exactly, so a name match
              here is guaranteed consistent with how the app itself matches
              IPOs during sync — avoids silent drift between the two."""
              s = (name or "").lower()
              s = re.sub(r"\([^)]*\)", " ", s)
              s = re.sub(r"\b(ipo|limited|ltd|pvt|private)\b", " ", s)
              s = re.sub(r"[^a-z0-9]+", " ", s)
              return " ".join(s.split())

          api_key = os.environ["PARSE_API_KEY"]
          url = "https://api.parse.bot/scraper/c1d0143b-268f-4141-8b27-85b4ca0368f8/get_live_gmp"
          req = urllib.request.Request(url, headers={"X-API-Key": api_key})

          # The live-data call is occasionally slow (it scrapes a page behind
          # the scenes), so allow a long read timeout and retry a couple of
          # times on timeouts, 429s and 5xx errors. A bad key / bad request
          # (other 4xx) fails immediately — retrying those can't help.
          raw = None
          PARSE_ATTEMPTS = 3
          for attempt in range(1, PARSE_ATTEMPTS + 1):
              try:
                  with urllib.request.urlopen(req, timeout=90) as resp:
                      raw = json.loads(resp.read().decode())
                  break
              except urllib.error.HTTPError as e:
                  body = ""
                  try:
                      body = e.read().decode()[:300]
                  except Exception:
                      pass
                  retryable = e.code == 429 or e.code >= 500
                  if retryable and attempt < PARSE_ATTEMPTS:
                      wait = 15 * attempt
                      print(f"::warning::Parse API HTTP {e.code} (attempt {attempt}/{PARSE_ATTEMPTS}) - retrying in {wait}s")
                      time.sleep(wait)
                      continue
                  print(f"::error::Parse API HTTP error {e.code}: {body}")
                  sys.exit(1)
              except Exception as e:
                  if attempt < PARSE_ATTEMPTS:
                      wait = 15 * attempt
                      print(f"::warning::Parse API request failed: {e} (attempt {attempt}/{PARSE_ATTEMPTS}) - retrying in {wait}s")
                      time.sleep(wait)
                      continue
                  print(f"::error::Parse API request failed after {PARSE_ATTEMPTS} attempts: {e}")
                  sys.exit(1)

          items = (raw.get("data") or {}).get("items") or raw.get("items") or []
          if not items:
              print("::warning::No items returned from Parse API — leaving ipos.json unchanged")
              sys.exit(0)

          # Load yesterday's file (if any) so we can carry forward each IPO's
          # gmpHistory instead of overwriting it — this is what lets the app
          # show a date-wise GMP table, not just today's single number.
          existing_by_name = {}
          try:
              with open("ipos.json", "r", encoding="utf-8") as f:
                  prev = json.load(f)
              for prev_ipo in prev.get("ipos", []):
                  existing_by_name[normalize_name(prev_ipo.get("name", ""))] = prev_ipo
          except Exception:
              pass  # first run ever, or file missing/corrupt — start fresh

          # Known registrars the app can actually route "Check allotment" to.
          # A lookup result is only ever accepted if it matches one of these
          # (case-insensitively, substring match) — anything else is treated
          # as "couldn't determine" rather than saved as free text, so a
          # vague or wrong-sounding answer can never silently become a
          # broken registrar link in the app.
          KNOWN_REGISTRARS = [
              "KFin Technologies", "Link Intime", "Bigshare Services",
              "Cameo Corporate Services", "Skyline Financial Services",
          ]
          TAVILY_API_KEY = os.environ.get("TAVILY_API_KEY", "")
          if TAVILY_API_KEY:
              print(f"Registrar lookup via Tavily web search: ENABLED (key received, length {len(TAVILY_API_KEY)})")
          else:
              print("::warning::Registrar lookup: DISABLED - TAVILY_API_KEY secret was not received by this workflow run. Check the secret name in repo Settings > Secrets and variables > Actions.")
          _lookups_made = 0
          _LOOKUP_RUN_CAP = 25       # max searches per run (free plan = 1,000 credits/month, 1 credit per search)
          _LOOKUP_PACING_SECONDS = 1.5
          _MAX_TRIES_PER_IPO = 4     # give up on an IPO after this many unsuccessful searches...
          _RETRY_AFTER_DAYS = 1      # ...and wait at least this long between tries (new pages get published daily)
          _last_status = "skipped"   # "ok" | "error" | "skipped" - set by the lookup function

          # Words each registrar goes by in web pages. Matching is on these
          # aliases only, and a registrar is accepted only if exactly one of
          # the five is clearly named near the word "registrar" on a page that
          # is specifically about this IPO. Anything ambiguous stays unset.
          REGISTRAR_ALIASES = {
              "KFin Technologies": ["kfin technologies", "kfintech", "kfin tech", "kfin"],
              "Link Intime": ["link intime", "mufg intime", "mufg"],
              "Bigshare Services": ["bigshare"],
              "Cameo Corporate Services": ["cameo corporate", "cameo"],
              "Skyline Financial Services": ["skyline financial", "skyline"],
              "Maashitla Securities": ["maashitla securities", "maashitla"],
          }

          def _norm_text(t):
              return " ".join(re.sub(r"[^a-z0-9]+", " ", (t or "").lower()).split())

          def _query_variants(ipo_name):
              # Each retry of an unresolved IPO words the search differently,
              # so a miss on one phrasing can be caught by another, and newly
              # published pages get picked up automatically on later days.
              return [
                  f"{ipo_name} registrar to the issue",
                  f"{ipo_name} allotment status registrar",
                  f"{ipo_name} IPO details lead manager registrar",
                  f"{ipo_name} registrar",
              ]

          def lookup_registrar_via_search(ipo_name, try_index=0):
              """Finds an IPO's registrar with one web search (Tavily), then
              reads the result snippets directly - no AI model involved, so
              there is nothing to hallucinate and no model quota to exhaust.
              Returns one of KNOWN_REGISTRARS or None. Never guesses."""
              global _lookups_made, _last_status
              _last_status = "skipped"
              if not TAVILY_API_KEY or _lookups_made >= _LOOKUP_RUN_CAP:
                  return None
              core = normalize_name(ipo_name)           # e.g. "vans electroengineerings"
              core_words = core.split()
              if not core_words:
                  return None
              # A result counts as "about this IPO" only if its title or URL
              # contains the IPO's first two distinctive words.
              about_key = " ".join(core_words[:2])
              body = json.dumps({
                  "query": _query_variants(ipo_name)[min(try_index, 3)],
                  "search_depth": "basic",
                  "chunks_per_source": 3,
                  "max_results": 8,
                  "include_answer": True,   # Tavily's one-line answer, like the box at the top of a Google search
              }).encode()
              req = urllib.request.Request("https://api.tavily.com/search", data=body, headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {TAVILY_API_KEY}",
              })
              print(f"  -> searching registrar for: {ipo_name}")
              data = None
              for attempt in range(2):
                  _lookups_made += 1
                  try:
                      with urllib.request.urlopen(req, timeout=20) as resp:
                          data = json.loads(resp.read().decode())
                      break
                  except urllib.error.HTTPError as e:
                      try:
                          err_body = e.read().decode("utf-8", errors="ignore")[:300].replace("\n", " ")
                      except Exception:
                          err_body = "(no response body)"
                      if e.code == 429 and attempt == 0:
                          print(f"::warning::{ipo_name}: search rate limited, waiting 15s and retrying once")
                          time.sleep(15)
                          continue
                      print(f"::warning::{ipo_name}: registrar search failed: HTTP {e.code} {e.reason} | {err_body}")
                      _last_status = "error"
                      return None
                  except Exception as e:
                      print(f"::warning::{ipo_name}: registrar search failed: {e}")
                      _last_status = "error"
                      return None
              time.sleep(_LOOKUP_PACING_SECONDS)
              if not data:
                  _last_status = "error"
                  return None
              _last_status = "ok"

              votes = {name: 0 for name in REGISTRAR_ALIASES}
              pages_used = 0
              results = data.get("results", []) or []
              about_pages = 0       # diagnostics: pages that are about this IPO
              registrar_pages = 0   # diagnostics: ...and whose snippet even contains the word "registrar"

              # Tavily's one-line answer counts as ONE extra vote, under the same
              # rules as a page: it must mention this IPO and name the registrar
              # right next to the word "registrar".
              answer_text = _norm_text(data.get("answer") or "")
              answer_vote = None
              if answer_text and about_key in answer_text:
                  hits = set()
                  for m in re.finditer(r"registrar", answer_text):
                      window = answer_text[max(0, m.start() - 120): m.end() + 120]
                      for name, aliases in REGISTRAR_ALIASES.items():
                          if any(re.search(r"\b" + re.escape(a) + r"\b", window) for a in aliases):
                              hits.add(name)
                  if len(hits) == 1:
                      answer_vote = next(iter(hits))
                      votes[answer_vote] += 1

              for r in results:
                  title_url = _norm_text((r.get("title") or "") + " " + (r.get("url") or ""))
                  if about_key not in title_url:
                      continue                      # not a page about this IPO
                  about_pages += 1
                  text = _norm_text(r.get("content") or "")
                  if "registrar" in text:
                      registrar_pages += 1
                  hit_this_page = set()
                  for m in re.finditer(r"registrar", text):
                      window = text[max(0, m.start() - 120): m.end() + 120]
                      for name, aliases in REGISTRAR_ALIASES.items():
                          if any(re.search(r"\b" + re.escape(a) + r"\b", window) for a in aliases):
                              hit_this_page.add(name)
                  if hit_this_page:
                      pages_used += 1
                      for name in hit_this_page:
                          votes[name] += 1
              ranked = sorted(votes.items(), key=lambda kv: kv[1], reverse=True)
              top_name, top_votes = ranked[0]
              runner_votes = ranked[1][1]
              if top_votes >= 1 and top_votes > runner_votes:
                  src = f"{pages_used} page(s)" + (" + search answer" if answer_vote == top_name else "")
                  print(f"     found: {top_name} (supported by {src})")
                  return top_name
              print(f"::warning::{ipo_name}: no clear registrar - votes: { {k:v for k,v in votes.items() if v} or 'none' }; "
                    f"results={len(results)}, about_this_ipo={about_pages}, with_registrar_word={registrar_pages}, "
                    f"answer={'yes' if answer_text else 'none'} - left unset")
              return None

          def to_int(v, field_name, ipo_name):
              """Parse a number out of whatever the API gives us. Handles plain
              numbers, ranges like '130-137' or '₹130 to ₹137' (takes the higher
              end, since that's what gets blocked), and logs anything it can't
              parse at all so a future run (or a human) can see exactly which
              IPO/field needs attention instead of silently becoming 0."""
              if v is None or str(v).strip() in ("", "TBA", "N/A", "-", "--"):
                  print(f"::warning::{ipo_name}: '{field_name}' is empty/placeholder ('{v}') — left as 0")
                  return 0
              s = str(v).replace(",", "").replace("₹", "").strip()
              try:
                  return int(float(s))
              except Exception:
                  pass
              # range like "130-137" or "130 to 137" -> take the higher number
              nums = re.findall(r"\d+(?:\.\d+)?", s)
              if nums:
                  return int(float(max(nums, key=float)))
              print(f"::warning::{ipo_name}: could not parse '{field_name}' from raw value '{v}' — left as 0")
              return 0

          ipos = []
          incomplete = []
          found_list = []        # (ipo, registrar) found this run
          unresolved = []        # searched this run but no clear answer
          for it in items:
              name = (it.get("name") or "").strip()
              if not name:
                  continue
              full_name = name if name.lower().endswith("ipo") else f"{name} IPO"
              price = to_int(it.get("price"), "price", full_name)
              lot = to_int(it.get("lot_size"), "lot_size", full_name)
              gmp_pct = it.get("gmp_percent")
              gmp_price = it.get("gmp_price")
              data_complete = price > 0 and lot > 0
              if not data_complete:
                  incomplete.append(full_name)

              # Carry forward this IPO's existing GMP history (matched by
              # normalized name, same matching the app itself uses) and
              # append today's reading — but only once per day, so re-runs
              # on the same day (e.g. a manual trigger) don't duplicate.
              prev_ipo = existing_by_name.get(normalize_name(full_name), {})
              gmp_history = list(prev_ipo.get("gmpHistory") or [])
              today_iso = date.today().isoformat()
              already_logged_today = any(h.get("date") == today_iso for h in gmp_history)
              if not already_logged_today and (gmp_pct is not None or gmp_price is not None):
                  gmp_history.append({
                      "date": today_iso,
                      "gmpPercent": gmp_pct if gmp_pct is not None else None,
                      "gmpPrice": gmp_price if gmp_price is not None else None,
                  })
              # Keep roughly the last 90 days per IPO so this never grows unbounded.
              gmp_history = gmp_history[-90:]

              # Registrar: once known (either picked manually in the app, or
              # found by web search on a previous run), it's carried forward and
              # NEVER re-queried or overwritten — this respects a user's own
              # manual pick in the app as final, and keeps search usage down
              # to one lookup per IPO, ever, not once per day.
              registrar = prev_ipo.get("registrar") or ""
              tries = int(prev_ipo.get("registrarTries") or 0)
              last_try = prev_ipo.get("registrarLastTry") or ""
              due = True
              if last_try:
                  try:
                      due = (date.today() - date.fromisoformat(last_try)).days >= _RETRY_AFTER_DAYS
                  except Exception:
                      due = True
              if not registrar and data_complete and tries < _MAX_TRIES_PER_IPO and due:
                  # Only IPOs whose core data is already confirmed real, not
                  # tried too often, and not tried too recently - so an IPO
                  # that stays unresolved can never drain the free credits.
                  found = lookup_registrar_via_search(full_name, tries)
                  if _last_status == "ok":          # a real search happened (API outages don't use up a try)
                      tries += 1
                      last_try = date.today().isoformat()
                      if found:
                          registrar = found
                          found_list.append((full_name, found))
                      else:
                          unresolved.append(full_name)

              ipo_entry = {
                  "name": full_name,
                  "company": name,
                  "openDate": it.get("open_date") or "",
                  "closeDate": it.get("close_date") or "",
                  "allotmentDate": "",
                  "listingDate": "",
                  "priceBand": f"₹{price}" if price else "",
                  "maxPrice": price,
                  "lotSize": lot,
                  "registrar": registrar,
                  "registrarUrl": "",
                  "registrarTries": tries,
                  "registrarLastTry": last_try,
                  "gmpPercent": gmp_pct if gmp_pct is not None else None,
                  "gmpPrice": gmp_price if gmp_price is not None else None,
                  "gmpHistory": gmp_history,
                  "dataComplete": data_complete,
                  "notes": f"Issue size {it.get('ipo_size_cr') or it.get('ipo_size') or ''}. Auto-synced from InvestorGain via Parse API.".strip(),
              }
              ipos.append(ipo_entry)

          output = {
              "updatedAt": date.today().isoformat(),
              "updatedAtTime": datetime.now(timezone.utc).isoformat(),
              "source": "InvestorGain (via Parse.bot API) — auto-updated",
              "ipos": ipos,
          }

          with open("ipos.json", "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2, ensure_ascii=False)

          print(f"Wrote {len(ipos)} IPOs to ipos.json")
          have_registrar = sum(1 for i in ipos if i.get("registrar"))
          print(f"::notice::Registrar summary: {len(found_list)} found this run, {len(unresolved)} searched but unresolved, "
                f"{have_registrar}/{len(ipos)} IPOs now have a registrar, ~{_lookups_made} search credit(s) used")
          for n, r in found_list:
              print(f"  registrar found: {n} -> {r}")
          if incomplete:
              print(f"::warning::{len(incomplete)} IPO(s) missing price/lot size from the API: {', '.join(incomplete)}")
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name "ipo-data-bot"
          git config user.email "actions@github.com"
          git add ipos.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update IPO data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
